# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-phuong"
BBFILE_PATTERN_meta-phuong = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-phuong = "6"

LAYERDEPENDS_meta-phuong = "core"
LAYERSERIES_COMPAT_meta-phuong = "kirkstone"
